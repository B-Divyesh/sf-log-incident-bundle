[package]
name = "log-incident-bundle"
version = "0.1.3"
edition = "2024"
description = "Create bounded, redacted, portable incident log bundles"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-log-incident-bundle"
include = [
  "/src/main.rs",
  "/examples/payment-api.log",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[[bin]]
name = "log-incident-bundle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
